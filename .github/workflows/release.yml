name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    name: Validate stable release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require a stable tag matching the workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_tag.py "$RELEASE_TAG"

  build:
    needs: validate-tag
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Upload assets and publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          draft: false

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Check publishable crate order
        run: bash ./scripts/check-publish-order.sh > /dev/null

      - name: Publish workspace crates to crates.io
        run: |
          while IFS= read -r crate; do
            cargo publish --manifest-path "$crate/Cargo.toml"
            if [ "$crate" != "." ]; then
              sleep 30
            fi
          done < <(bash ./scripts/check-publish-order.sh)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify published crates independently
        run: |
          sleep 30
          while IFS= read -r crate; do
            target_dir="$RUNNER_TEMP/package-${crate//\//-}"
            CARGO_TARGET_DIR="$target_dir" cargo package \
              --manifest-path "$crate/Cargo.toml" \
              --all-features \
              --locked
          done < <(bash ./scripts/check-publish-order.sh)
