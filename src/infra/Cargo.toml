[package]
name = "sabiql-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Infrastructure layer for sabiql"
license.workspace = true
repository.workspace = true

[features]
test-support = []

[lib]
path = "lib.rs"

[dependencies]
base64.workspace = true
async-trait.workspace = true
csv.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
urlencoding.workspace = true
url.workspace = true
quick-xml.workspace = true
uuid.workspace = true
keyring-core.workspace = true
sabiql-app.workspace = true
sabiql-domain.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
